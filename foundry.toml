[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 128
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
