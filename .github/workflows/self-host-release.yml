name: Self-host release package

on:
  workflow_dispatch:
  push:
    tags:
      - "selfhost-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate package configuration logic
        working-directory: frontend
        run: npm run test:selfhost-config

      - name: Build supported Cloudflare package
        working-directory: frontend
        run: npm run selfhost:package -- --output-dir=../self-host-dist

      - name: Locate release artifacts
        id: artifacts
        shell: bash
        run: |
          archive="$(find self-host-dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          sbom="$(find self-host-dist -mindepth 2 -maxdepth 2 -type f -name 'SBOM.cdx.json' -print -quit)"
          test -n "$archive"
          test -n "$sbom"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"
          manifest="$(find self-host-dist -mindepth 2 -maxdepth 2 -type f -name 'release-manifest.json' -print -quit)"
          test -n "$manifest"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Attest archive and SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifacts.outputs.archive }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: openescrow-cloudflare-self-host-${{ github.sha }}
          path: |
            self-host-dist/*.tar.gz
            self-host-dist/*.sha256
            self-host-dist/*/SBOM.cdx.json
            self-host-dist/*/release-manifest.json
          if-no-files-found: error

      - name: Publish tagged self-host release
        if: startsWith(github.ref, 'refs/tags/selfhost-v')
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.artifacts.outputs.archive }}
          CHECKSUM: ${{ steps.artifacts.outputs.checksum }}
          SBOM: ${{ steps.artifacts.outputs.sbom }}
          MANIFEST: ${{ steps.artifacts.outputs.manifest }}
        shell: bash
        run: |
          notes="$(mktemp)"
          printf '%s\n' \
            'Supported Cloudflare-oriented distribution of the complete OpenEscrow Base Sepolia testnet application.' \
            '' \
            'This release is for synthetic testing and qualified self-host operators. It does not enable mainnet, real rental deposits, a production fiat route, or production yield assets. Read the bundled self-host/cloudflare/README.md, SECURITY.md, BACKUP-AND-RESTORE.md, and UPGRADE.md before deployment.' \
            '' \
            'Verify the archive checksum and GitHub artifact attestation before use.' > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" "$CHECKSUM" "$SBOM" "$MANIFEST" \
            --verify-tag \
            --latest \
            --title "OpenEscrow self-hosted testnet v0.1.0" \
            --notes-file "$notes"
